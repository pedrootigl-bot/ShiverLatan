<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Login concluído</title>
  </head>
  <body>
    <script>
      (function () {
        var payload = { type: "shiver-auth-complete", ok: true };
        if (window.opener && !window.opener.closed) {
          window.opener.postMessage(payload, window.location.origin);
          window.opener.postMessage(payload, "*");
        }
        window.close();
        setTimeout(function () {
          document.body.textContent = "Login concluído. Você pode fechar esta janela.";
        }, 400);
      })();
    </script>
  </body>
</html>
